# Same domain/certificates as v1 (text-to-icpc2.com). Certbot volumes are reused.
limit_req_zone $binary_remote_addr zone=api:10m rate=5r/s;

server {
    listen 80;
    server_name text-to-icpc2.com www.text-to-icpc2.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://text-to-icpc2.com$request_uri; }
}

server {
    listen 443 ssl;
    server_name www.text-to-icpc2.com;
    ssl_certificate /etc/letsencrypt/live/text-to-icpc2.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/text-to-icpc2.com/privkey.pem;
    return 301 https://text-to-icpc2.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name text-to-icpc2.com;
    ssl_certificate /etc/letsencrypt/live/text-to-icpc2.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/text-to-icpc2.com/privkey.pem;

    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy same-origin;

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;   # /api/admin/reload downloads the new model
    }

    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
