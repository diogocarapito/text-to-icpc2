# Dedicated server: app + postgres + caddy (automatic HTTPS) + backups + retrain scheduler.
#   cd deploy && nano .env && docker compose up -d --build
x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://icpc2user:${POSTGRES_PASSWORD}@db:5432/icpc2
  MODEL_REPO: ${MODEL_REPO:-diogocarapito/text-to-icpc2}
  ICPC2_ADMIN_TOKEN: ${ICPC2_ADMIN_TOKEN:?set in deploy/.env}
  HF_TOKEN: ${HF_TOKEN:-}

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: icpc2
      POSTGRES_USER: icpc2user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in deploy/.env}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U icpc2user -d icpc2"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: {context: .., args: {GIT_SHA: "${GIT_SHA:-}"}}
    restart: always
    environment:
      <<: *app-env
      MODEL_REVISION: ${MODEL_REVISION:-main}
    volumes: [hf_cache:/hf]
    mem_limit: 3g
    depends_on:
      db: {condition: service_healthy}

  caddy:
    image: caddy:2-alpine
    restart: always
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN:?set in deploy/.env}
      ACME_EMAIL: ${ACME_EMAIL:?set in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]

  # Daily retrain check; training runs on an ephemeral DigitalOcean GPU Droplet.
  scheduler:
    build: {context: .., args: {GIT_SHA: "${GIT_SHA:-}"}}
    restart: always
    user: root
    environment:
      <<: *app-env
      ICPC2_VPS_URL: http://app:8000
      DIGITALOCEAN_TOKEN: ${DIGITALOCEAN_TOKEN:-}
      ICPC2_SSH_KEY: /keys/id_ed25519
    volumes:
      - scheduler_keys:/keys
      - scheduler_state:/app/reports
      - ./scheduler.sh:/scheduler.sh:ro
    entrypoint: ["/bin/sh", "/scheduler.sh"]
    depends_on: [app]

  backup:  # nightly pg_dump of the interaction log, keeps 14 days
    image: postgres:16-alpine
    restart: always
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes: [./backups:/backups, ./backup.sh:/backup.sh:ro]
    entrypoint: ["/bin/sh", "/backup.sh"]
    depends_on:
      db: {condition: service_healthy}

volumes:
  postgres_data:
  hf_cache:
  caddy_data:
  caddy_config:
  scheduler_keys:
  scheduler_state:
