# VPS deployment: app + postgres + nginx + certbot.
#   cd deploy && cp ../.env.example .env  (fill in) && docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: icpc2
      POSTGRES_USER: icpc2user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in deploy/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U icpc2user -d icpc2"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: ..
    restart: always
    environment:
      DATABASE_URL: postgresql+psycopg://icpc2user:${POSTGRES_PASSWORD}@db:5432/icpc2
      MODEL_REPO: ${MODEL_REPO:-diogocarapito/text-to-icpc2-v2}
      MODEL_REVISION: main
      ICPC2_ADMIN_TOKEN: ${ICPC2_ADMIN_TOKEN:?set in deploy/.env}
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - hf_cache:/hf
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    restart: always
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    depends_on: [app]

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  backup:  # nightly pg_dump of the interaction log, keeps 14 days
    image: postgres:16-alpine
    restart: always
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint: >
      /bin/sh -c 'while :; do
        pg_dump -h db -U icpc2user icpc2 | gzip > /backups/icpc2-$$(date +%F).sql.gz;
        find /backups -name "*.sql.gz" -mtime +14 -delete; sleep 86400; done'
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  hf_cache:
  certbot_www:
  certbot_conf:
