[project]
name = "icpc2"
version = "0.1.0"
description = "Free-text clinical diagnosis (PT-PT / EN) -> ICPC-2 code, with a feedback-driven retraining loop"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
  "pandas>=2.2",
  "pyarrow>=16",
  "pyyaml>=6",
  "typer>=0.12",
  "numpy>=1.26",
  "huggingface_hub>=0.25",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Shared by training + serving: model inference
infer = [
  "torch>=2.4",
  "transformers>=5.0",           # v5 API (warmup_steps as ratio); ModernBERT-style encoders (mmBERT)
  "sentence-transformers>=5.0",
  "sentencepiece>=0.2",          # slow->fast tokenizer conversion (XLM-R, older BERTs)
  "protobuf>=4",
]
train = [
  "icpc2[infer]",
  "datasets>=3.0",
  "accelerate>=1.0",
  "scikit-learn>=1.5",
  "wandb>=0.18",                 # optional: set report_to in configs
]
synth = ["anthropic>=1.0", "pydantic>=2"]
serve = [
  "icpc2[infer]",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27", "fastapi>=0.115", "sqlalchemy>=2.0", "jinja2>=3.1"]

[project.scripts]
icpc2 = "icpc2.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/icpc2"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff.lint]
ignore = ["SIM115", "BLE001", "C408", "ISC004", "RUF012", "E501"]
